# Voice 语音服务配置
# 文件: voice.yaml -- 环境变量: QIANXUE_VOICE__TTS__DEFAULT_VOICE=zh-CN-XiaoxiaoNeural

funasr:
  websocket_url: "ws://localhost:10095"     # FunASR Server WebSocket 地址
  timeout: 30                                # ASR 调用超时（秒）

tts:
  backend: "qwen3"                            # TTS 引擎: "edge" (Edge TTS 云端) | "qwen3" (Qwen3-TTS 本地，WSL2+GPU)
  default_voice: "zh-CN-XiaoxiaoNeural"      # Edge-TTS 默认音色
  timeout: 30                                # TTS 调用超时（秒）
  rate: "+0%"                                # 语速调整
  volume: "+0%"                              # 音量调整

qwen3:
  api_url: "http://localhost:8880"            # Qwen3-TTS OpenAI 兼容 API 地址
  model: "tts-1-zh"                          # 模型名
  voice: "Serena"                            # 音色: Vivian(明亮少女) | Serena(温柔少女) | 等

audio:
  target_sample_rate: 16000                  # FunASR 要求的采样率
  target_channels: 1                         # FunASR 要求的声道数（mono）
