# Voice 语音服务配置
# 文件: voice.yaml -- 环境变量: QIANXUE_VOICE__TTS__DEFAULT_VOICE=zh-CN-XiaoxiaoNeural

funasr:
  websocket_url: "ws://localhost:10095"     # FunASR Server WebSocket 地址
  timeout: 30                                # ASR 调用超时（秒）

tts:
  default_voice: "zh-CN-XiaoxiaoNeural"      # Edge-TTS 默认音色（晓晓，温暖活泼，适合千雪人设 per D-01）
  timeout: 30                                # TTS 调用超时（秒）
  rate: "+0%"                                # 语速调整
  volume: "+0%"                              # 音量调整

audio:
  target_sample_rate: 16000                  # FunASR 要求的采样率
  target_channels: 1                         # FunASR 要求的声道数（mono）
