# Mypy configuration file
# Reference: https://mypy.readthedocs.io/

[mypy]
# Python version
python_version = 3.10

# Strict mode (optional, disabled for first version)
# strict = True

# Warning options
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True

# Error options
disallow_untyped_defs = False  # Don't disable untyped definitions in first version
disallow_any_generics = False
check_untyped_defs = True

# Third-party stubs
[mypy-chromadb.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True
